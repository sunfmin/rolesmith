# rolesmith's promises (`truefit promise`): each sentence of the help topics, README.md and docs/adr/
# that a run could break. Those of commands not built yet are `kept` until the issue that builds
# the command adds its test and turns `kept` into `check = ["test"]`. Candidates that are rationale,
# history or advice are marked `not` in .truefit/promises.json.

# Where the stand-ins of the programs rolesmith drives (gh, mytokens) will live: each one put
# there needs a [[standin]] contract, or `truefit next` asks for it. None exists yet.
[contract]
standins = ["tests/fake-*", "tests/fakes"]

[promises]
sources = ["src/help/*.md", "README.md", "docs/adr/*.md"]

[[promise]]
name = "never-calls-a-model"
says = '''**It never calls a model.**'''
source = "docs/adr/0001-roles-leave-guild-and-people-schedule-their-drafting-and-distilling.md:24"
kept = '''kept by absence: rolesmith has no HTTP client or model SDK among its dependencies (Cargo.toml) and no command that would call one; no test can see a call that is not made'''

[[promise]]
name = "drafting-and-distilling-only-by-a-command"
says = '''A role is drafted when someone runs `rolesmith new`; lessons are distilled when someone runs `rolesmith distill`. Every change to a library lands as a pull request a person merges.'''
source = "docs/adr/0001-roles-leave-guild-and-people-schedule-their-drafting-and-distilling.md:22"
kept = '''not built yet: rolesmith has only its CLI frame (rolesmith#1); the issues that build `new`, `distill` and the library pull requests add their tests and set check = ["test"]'''

[[promise]]
name = "never-holds-a-secret"
says = '''rolesmith never holds a secret.'''
source = "docs/adr/0007-rolesmith-never-holds-a-secret.md:14"
kept = '''not built yet: no command reads a credential yet (the CLI's frame (rolesmith#1) and `rolesmith check` (rolesmith#2) are all that is built); the issue that builds `env` adds the test that no value reaches disk or output files and sets check = ["test"]'''

[[promise]]
name = "credential-values-only-to-a-process"
says = '''A role names the credentials it needs by their **mytokens** entry; rolesmith reads a value only to hand it to a process (`rolesmith env`), and never writes one to disk, to a library, to a project or to its own output files.'''
source = "docs/adr/0007-rolesmith-never-holds-a-secret.md:15"
kept = '''not built yet: `rolesmith env` does not exist yet (the CLI's frame (rolesmith#1) and `rolesmith check` (rolesmith#2) are all that is built); its issue adds the test against the mytokens stand-in and sets check = ["test"]'''

