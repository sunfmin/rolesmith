# tests/doctor.rs env_prints_export_lines_that_sh_evals_back_to_each_value, env_exports_a_profile_service_by_its_own_field_names, env_exports_a_profile_beside_credentials_and_refuses_a_name_from_two_sources, env_refuses_a_service_no_credential_maps_and_a_failing_read
