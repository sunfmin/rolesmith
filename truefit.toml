# tests/doctor.rs doctor_probe_reads_each_source_once_and_answers_how_it_went_without_a_value (`--timeout 1`: a slow source is killed and answered `needs a person`)
[[promise]]
name = "a-probe-reads-once-within-its-bound-and-keeps-no-value"
says = '''`rolesmith doctor --probe <role> | --project <dir> [--timeout <seconds>]` reads each mapped service's command once as `env` does, but in a session of its own (no controlling terminal) with stdin a pipe nothing writes to, for at most the bound (`--timeout`, default 20 s), and never prints or keeps a value.'''
source = "src/commands/doctor.rs:41"
check = ["test"]

# tests/doctor.rs doctor_probe_reads_each_source_once_and_answers_how_it_went_without_a_value, doctor_reports_a_kept_probe_until_the_command_changes
[[promise]]
name = "probe-outcome-is-one-of-four"
says = '''`probe.outcome` is `unattended` (finished, every variable the role's `[credential]`s expect printed; `seconds`), `needs a person` (not finished within the bound, then killed with its whole session; or failed saying it needs a terminal), `refused` (exited non-zero, with its stderr; or printed a line that is not a variable) or `incomplete` (`missing` names the expected variables it did not print). A probe may itself raise a Touch ID prompt; the prompt appearing is the answer.'''
source = "src/commands/doctor.rs:41"
check = ["test"]

# tests/doctor.rs doctor_reports_a_kept_probe_until_the_command_changes, doctor_fails_on_kept_probes_it_cannot_read_rather_than_take_none
[[promise]]
name = "plain-doctor-runs-no-source-and-answers-the-kept-probe"
says = '''Plain `doctor` runs no source and answers the kept outcome while the service maps to the same command; a kept `needs a person` is missing (`kind` `service`), naming when, with the fix (a service account token, or a source that needs no person). A service never probed, or probed with another command, is `unchecked`.'''
source = "src/commands/doctor.rs:43"
check = ["test"]

