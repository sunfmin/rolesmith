# tests/doctor.rs doctor_runs_a_mapped_services_check_never_its_command_and_lists_one_without_a_check_unchecked
[[promise]]
name = "doctor-runs-a-mapped-check-never-its-command"
says = '''`doctor` runs `command` only with `--probe` (§7.4). A mapped service is not looked for in mytokens: its `check` runs on this machine (with `--host` too, as values are read only here); exit 0 is present, anything else is missing (`kind` `service`). One without a `check` is answered `unchecked` and does not make doctor refuse.'''
source = "src/commands/doctor.rs:23"
check = ["test"]

